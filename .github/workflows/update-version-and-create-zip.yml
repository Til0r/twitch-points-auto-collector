name: Update Version and Publish Zip to GitHub Packages

on:
 push:
   tags:
     - "*"

permissions:
 contents: write

jobs:
 update-version-and-publish-zip:
   runs-on: ubuntu-latest

   steps:
     - name: Checkout Repository
       uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - name: Get Tag Name
       id: extract_tag
       run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

     - name: Detect Default Branch
       id: detect_branch
       run: |
         default_branch=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
         echo "DEFAULT_BRANCH=$default_branch" >> $GITHUB_ENV

     - name: Update Version in Manifest
       run: |
         version="${{ env.TAG_NAME }}"
         jq --arg new_version "$version" '.version = $new_version' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

     - name: Set Filename Variable
       id: set_filename
       run: echo "FILENAME=twitch-points-auto-collector_${{ env.TAG_NAME }}.zip" >> $GITHUB_ENV

     - name: Create Zip Archive
       run: |
         zip -r "$FILENAME" *
         echo "$FILENAME created"

     - name: Create or Update GitHub Release
       env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       run: |
         if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
           gh release create "$TAG_NAME" \
             --title "Release $TAG_NAME" \
             --notes "Auto-generated release for version $TAG_NAME"
         fi

         gh release upload "$TAG_NAME" "$FILENAME" --clobber

     - name: Configure Git User
       run: |
         git config --global user.name "${{ github.actor }}"
         git config --global user.email "${{ github.actor }}@users.noreply.github.com"

     - name: Switch to Default Branch
       run: git checkout ${{ env.DEFAULT_BRANCH }}

     - name: Commit Changes
       run: |
         git add manifest.json
         if git diff --cached --quiet; then
           echo "manifest.json already matches $TAG_NAME"
           exit 0
         fi

         git commit -m "Update manifest version to $TAG_NAME"
         git push origin ${{ env.DEFAULT_BRANCH }}

     - name: Cleanup
       run: rm "$FILENAME"
